:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1512;--card:#17201b;--ink:#ece6d8;--mut:#9aa59d;--acc:#e0505c;--gold:#d9a548;--line:#2a372f}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
header{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#f3ead7;padding:28px 20px 0;position:relative;overflow:hidden}

.wrap{max-width:1100px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font:900 clamp(30px,6vw,56px)/1 "Playfair Display",Georgia,serif;margin:18px 0 6px;letter-spacing:-.5px}
h1 span{color:var(--gold)}
.tag{margin:0 0 34px;color:#cdbf9f;max-width:620px}
.lang button{background:transparent;border:1px solid #cdbf9f66;color:#f3ead7;padding:6px 12px;border-radius:99px;cursor:pointer;font:600 13px Inter,sans-serif;margin-left:6px}
.lang button.on{background:var(--gold);border-color:var(--gold);color:#1b1408}
.ticker{background:var(--acc);color:#fff;overflow:hidden;white-space:nowrap;font-size:13px;font-weight:600}
.ticker div{display:inline-block;padding:8px 0;animation:mq 60s linear infinite}
.ticker span{margin:0 28px}.ticker span:before{content:"◆ ";opacity:.7}
@keyframes mq{to{transform:translateX(-50%)}}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}
nav button{flex:none;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:8px 16px;border-radius:99px;cursor:pointer;font:600 14px Inter,sans-serif}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:24px 16px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:6px;padding:20px;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px #0002}
.card.lead{grid-column:1/-1;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#f3ead7;border-color:var(--c)}
.card.lead h2{font-size:clamp(26px,4vw,38px)}.card.lead p,.card.lead .meta{color:#cdbf9f}
.badge{font:600 11px Inter;letter-spacing:1.3px;text-transform:uppercase;color:var(--c)}
.card.lead .badge{color:var(--gold)}
h2{font:700 21px/1.2 "Playfair Display",Georgia,serif;margin:8px 0}
p{margin:0 0 14px;color:var(--mut)}
.meta{margin-top:auto;display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mut)}
a{color:inherit;font-weight:600;text-decoration:none;border-bottom:2px solid var(--c)}
footer{max-width:1100px;margin:30px auto;padding:20px 16px;border-top:1px solid var(--line);color:var(--mut);font-size:13px}
</style>
</head>
