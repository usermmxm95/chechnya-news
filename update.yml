name: Update news

on:
  schedule:
    - cron: "0 5,17 * * *"   # 05:00 and 17:00 UTC every day
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build page from news feeds
        run: python build.py
      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Daily news update" && git push)
